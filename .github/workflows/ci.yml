name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff pytest
      - run: ruff check .
      - run: pytest -v
      - name: Run CI Evaluation Gate
        run: python eval/eval_gate.py

  package-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies and package in editable mode
        run: |
          pip install -r requirements.txt
          pip install -e .
      - name: Run HTTP server smoke test
        run: python tests/smoke_test.py
